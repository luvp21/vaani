AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Vaani — web app, repo ingest, script gen, script lock, Polly Kajal narration, Fargate render, recording upload, Transcribe (stages 1-3, 5, 6, fallback narration, render)

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Google AI Studio API key used by script generation (pass with --parameter-overrides GeminiApiKey=...)
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Groq API key used by the Whisper STT path (pass with --parameter-overrides GroqApiKey=...)
  GithubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional GitHub token for repo ingest. Without one, GitHub allows only 60 requests an hour per IP, and Lambda's IPs are shared.
  AuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Derives the private judge link key (AUTH_SECRET in backend/.env). Changing it replaces the link.
  SiteUrl:
    Type: String
    Default: "https://10jlhtgcih.execute-api.us-east-1.amazonaws.com"
    Description: This site's address (the stack output SiteUrl). Google sign-in returns here.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Optional. OAuth client id from Google Cloud Console; with the secret, switches on "Continue with Google".
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Optional. OAuth client secret from Google Cloud Console.
  PauseVideoCreation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: When "true", accounts with limits (testers and Google members) cannot draft, lock or render a video. The judge and team accounts are not affected. Pass it on every deploy, because a parameter left out goes back to its default.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. Where alerts go (a failed render, a spike of API errors). AWS emails a confirmation link to click.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the render Fargate task launches into (default VPC is fine for this)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the render Fargate task (assignPublicIp is used, so no NAT gateway needed)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasGoogle: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        S3_BUCKET: !Ref VaaniBucket
        AUTH_SECRET: !Ref AuthSecret
        USER_POOL_ID: !Ref UserPool
        TESTER_CLIENT_ID: !Ref TesterClient
        JUDGE_CLIENT_ID: !Ref JudgeClient
        WEB_CLIENT_ID: !If [HasGoogle, !Ref WebClient, ""]
        COGNITO_DOMAIN: !If [HasGoogle, !Sub "vaani-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com", ""]
        SITE_URL: !Ref SiteUrl
        VIDEO_CREATION_PAUSED: !Ref PauseVideoCreation
        USAGE_TABLE: !Ref UsageTable

Resources:
  VaaniBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "vaani-ai-${AWS::AccountId}-${AWS::Region}"
      CorsConfiguration:
        # Needed so the browser can PUT recordings directly to S3 via a
        # presigned URL (bypasses Lambda/API Gateway payload limits, which a
        # multi-minute scene recording would otherwise exceed).
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: [PUT]
            AllowedHeaders: ["*"]

  # A tester's usage counters (drafts, locks, renders), one item per account, plus the
  # per-minute rate-limit counters. DynamoDB
  # so each count is an atomic conditional update: two requests at the same moment
  # can't both take the last render.
  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-usage"
      BillingMode: PAY_PER_REQUEST
      # Rate-limit counters ("rate#...") share this table and delete themselves after their minute or day.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  # ----------------------------------------------------------------- sign-in (Cognito)
  # Fixed users only (tester1, tester2, judge), created by backend/scripts/provision-users.mjs;
  # nobody can sign themselves up. The API verifies the ID tokens this pool issues.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
      MfaConfiguration: "OFF"

  TesterGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: tester
      Description: "Shared demo accounts, one video each"

  TeamGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: team
      Description: "For us to test with: no allowances, no length limit, own projects only"

  JudgeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: judge
      Description: "Sees every project, signs in only through the private link"

  # Two app clients so the two kinds of session can last different times: a
  # tester's shared account shouldn't stay signed in for weeks, while the judge,
  # who has only a link, needs a long one. Sign-in is done by our own Lambda
  # (an admin call), so no client secret is needed in the browser.
  TesterClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: tester
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  JudgeClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: judge
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ----------------------------------------------------------------- Google sign-in
  # "Continue with Google": Cognito's hosted page sends people to Google and back. Off unless
  # both Google parameters are given. Someone who signs in this way has no group; being
  # federated makes them a "member" (one video, like a tester).
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "vaani-${AWS::AccountId}"

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        name: name
        username: sub

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: HasGoogle
    DependsOn: GoogleIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web
      GenerateSecret: false
      SupportedIdentityProviders: [Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub "${SiteUrl}/auth/callback"
        - http://localhost:5173/auth/callback
      LogoutURLs:
        - !Ref SiteUrl
        - http://localhost:5173
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  VaaniHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The API is public and unauthenticated, and every call can spend Gemini,
      # Groq, Polly or Fargate money. This caps how fast anyone can hit it (page
      # loads count too, so the ceiling leaves room for a few visitors at once).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["content-type"]

  # Sign-in for the fixed tester and judge accounts, and "who am I / how much is left".
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: auth.handler
      CodeUri: src
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt UserPool.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/auth/login
            Method: POST
        JudgeLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/auth/judge-link
            Method: POST
        Google:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/auth/google
            Method: POST
        Config:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/auth/config
            Method: GET
        Refresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/auth/refresh
            Method: POST
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/auth/me
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/auth.ts

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ingest.handler
      CodeUri: src
      Environment:
        Variables:
          GITHUB_TOKEN: !Ref GithubToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        Ingest:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/ingest
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/ingest.ts

  ScriptPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scriptSteps.planHandler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
      # Reads and writes the account's draft count (quota/<user>.json).
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/script/plan
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/scriptSteps.ts

  WriteSceneFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: scriptSteps.writeSceneHandler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/script/write-scene
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/scriptSteps.ts

  SceneGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sceneGen.handler
      CodeUri: src
      Timeout: 60
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
      Events:
        SceneGen:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/script/scene
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/sceneGen.ts

  LockScriptFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lockScript.handler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        LockScript:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/script/lock
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/lockScript.ts

  NarrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: narrate.handler
      CodeUri: src
      Timeout: 120
      Environment:
        Variables:
          POLLY_ENGINE: "neural"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
      Events:
        Narrate:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/narrate
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/narrate.ts

  # --- Render stage (stage 8) — Fargate, never Lambda, see CLAUDE.md #6 ---
  # One-off task per render (not a long-running ECS service), so cost is
  # only incurred for actual render runtime, not idle capacity.

  RenderRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vaani-render

  RenderCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: vaani-render-cluster

  RenderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Vaani render Fargate task - outbound only, nothing inbound
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  RenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /vaani/render
      RetentionInDays: 7

  RenderTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  RenderTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RenderS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${VaaniBucket.Arn}/*"

  RenderTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vaani-render
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "2048"
      Memory: "4096"
      ExecutionRoleArn: !GetAtt RenderTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt RenderTaskRole.Arn
      ContainerDefinitions:
        - Name: render
          Image: !Sub "${RenderRepository.RepositoryUri}:latest"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RenderLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: render

  RenderTriggerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: render.handler
      CodeUri: src
      Environment:
        Variables:
          RENDER_STATE_MACHINE_ARN: !Ref RenderStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt RenderStateMachine.Name
      Events:
        Render:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/render
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/render.ts

  # ----------------------------------------------------------------- render workflow
  # The API only starts this; it runs the render on Fargate, waits for it, and
  # tidies up when it fails: marks the render failed (a crashed task otherwise
  # leaves the app waiting on "rendering" forever), gives a tester their one
  # render back, and raises an alert.
  RenderStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/render.asl.json
      DefinitionSubstitutions:
        Cluster: !Ref RenderCluster
        TaskDefinition: !Ref RenderTaskDefinition
        SecurityGroup: !Ref RenderSecurityGroup
        SubnetIds: !Join ["\",\"", !Ref SubnetIds]
        Bucket: !Ref VaaniBucket
        Region: !Ref AWS::Region
        FailedFunctionArn: !GetAtt RenderFailedFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RenderFailedFunction
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ecs:RunTask
              Resource: !Ref RenderTaskDefinition
            - Effect: Allow
              Action:
                - ecs:StopTask
                - ecs:DescribeTasks
              Resource: "*"
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                - !GetAtt RenderTaskExecutionRole.Arn
                - !GetAtt RenderTaskRole.Arn
            # Needed for the ".sync" integration, which watches the task through EventBridge.
            - Effect: Allow
              Action:
                - events:PutTargets
                - events:PutRule
                - events:DescribeRule
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule"

  RenderFailedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: renderFailed.handler
      CodeUri: src
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref AlertsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsTopic.TopicName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/renderFailed.ts

  # ----------------------------------------------------------------- alerts
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RenderFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-render-failed"
      AlarmDescription: A render workflow execution failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref RenderStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx"
      AlarmDescription: The API is returning server errors (5 or more in 5 minutes)
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref VaaniHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  RenderStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: renderStatus.handler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        RenderStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/render/{scriptId}/status
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/renderStatus.ts

  RecordingUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recordingUploadUrl.handler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        RecordingUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/recording/upload-url
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/recordingUploadUrl.ts

  TranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transcribe.handler
      CodeUri: src
      # Runs the transcription in the background (see handlers/transcribe.ts), so this
      # is the Whisper call plus its retries, not an API Gateway wait.
      Timeout: 180
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
      # The API call hands the work to a background run of this same function.
      # Async runs are not retried: a failure is stored and shown, not repeated.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-TranscribeFunction-*"
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        Transcribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/transcribe
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/transcribe.ts

  TranscribeStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: transcribeStatus.handler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        TranscribeStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/transcribe/{scriptId}/{sceneId}/status
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/transcribeStatus.ts

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: sync.handler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        Sync:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/sync
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/sync.ts

  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: projects.listHandler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        ListProjects:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/projects
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/projects.ts

  ProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: projects.getHandler
      CodeUri: src
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsageTable
        - S3CrudPolicy:
            BucketName: !Ref VaaniBucket
      Events:
        GetProject:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /api/projects/{scriptId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints:
          - handlers/projects.ts

  # ---------------------------------------------------------------- web app
  # The built frontend is served by a small Lambda behind the same HTTP API
  # that serves /api/*, so the browser talks to one https origin: no CORS, no
  # API base URL, and https (which the camera, microphone and screen capture
  # need). CloudFront would be the usual choice, but this account can't create
  # CloudFront resources until AWS verifies it. The build lives in site/dist
  # (run `npm run build:site` before `sam build`).
  SiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: site
      Timeout: 10
      MemorySize: 256
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /
            Method: GET
        Everything:
          Type: HttpApi
          Properties:
            ApiId: !Ref VaaniHttpApi
            Path: /{proxy+}
            Method: GET

Outputs:
  UserPoolId:
    Description: Cognito user pool (put in backend/.env as USER_POOL_ID)
    Value: !Ref UserPool
  GoogleRedirectUri:
    Description: Add this to "Authorized redirect URIs" of the Google OAuth client (Google sign-in returns through Cognito)
    Value: !Sub "https://vaani-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  TesterClientId:
    Value: !Ref TesterClient
  JudgeClientId:
    Value: !Ref JudgeClient
  RenderStateMachineArn:
    Description: The render workflow
    Value: !Ref RenderStateMachine
  AlertsTopicArn:
    Description: Alerts (failed renders, API errors) are published here
    Value: !Ref AlertsTopic
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${VaaniHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Value: !Ref VaaniBucket
  RenderRepositoryUri:
    Description: Push the render container image here before the render step will work
    Value: !GetAtt RenderRepository.RepositoryUri
  SiteUrl:
    Description: The live web app (also the API, under /api)
    Value: !Sub "https://${VaaniHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
